services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: interview_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./temp_data:/app/temp_data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: interview_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./temp_data:/app/temp_data
      - ./assets:/app/assets

networks:
  default:
    name: ai_coach_network
