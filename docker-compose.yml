services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: interview_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - INTERNAL_API_KEY=dev-key-12345
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./temp_data:/app/temp_data
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: interview_ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
      - INTERNAL_API_KEY=dev-key-12345
    volumes:
      - ./temp_data:/app/temp_data
      - ./assets:/app/assets

networks:
  default:
    name: ai_coach_network
