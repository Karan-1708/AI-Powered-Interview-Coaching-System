name: ai-interview-coach
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # Frontend
    - streamlit
    - requests
    # Backend Server
    - fastapi
    - uvicorn
    - python-multipart
    - pydantic
    # AI & Audio Processing
    - faster-whisper
    - torch
    - librosa
    - soundfile
    # LLM & Utilities
    - ollama
    - pyttsx3
    - psutil
    - py-cpuinfo